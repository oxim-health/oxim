{{- if .Values.service.ports }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "oxim.fullname" . }}
  labels:
    {{- include "oxim.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if .Values.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  {{- end }}
  selector:
    {{- include "oxim.selectorLabels" . | nindent 4 }}
  ports:
    {{- range .Values.service.ports }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .name }}
      protocol: {{ default "TCP" .protocol }}
    {{- end }}
---
# Stable network identity for the StatefulSet.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "oxim.fullname" . }}-headless
  labels:
    {{- include "oxim.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "oxim.selectorLabels" . | nindent 4 }}
  ports:
    {{- range .Values.service.ports }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .name }}
      protocol: {{ default "TCP" .protocol }}
    {{- end }}
{{- end }}
