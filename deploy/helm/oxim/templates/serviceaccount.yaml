{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "oxim.serviceAccountName" . }}
  labels:
    {{- include "oxim.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# OXIM does not use the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
