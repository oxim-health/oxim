apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "oxim.fullname" . }}-config
  labels:
    {{- include "oxim.labels" . | nindent 4 }}
data:
  oxim.yaml: |
    {{- include "oxim.config" . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "oxim.fullname" . }}-channels
  labels:
    {{- include "oxim.labels" . | nindent 4 }}
data:
  {{- range $name, $content := .Values.channels }}
  {{ $name }}: |
    {{- $content | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "oxim.fullname" . }}-tables
  labels:
    {{- include "oxim.labels" . | nindent 4 }}
data:
  {{- range $name, $content := .Values.tables }}
  {{ $name }}: |
    {{- $content | nindent 4 }}
  {{- end }}
