# Settings for the packaged layout (deb, rpm, offline bundle). The unit
# itself is identical to the output of `oxim service unit`; this drop-in adds
# what only makes sense when OXIM is installed under /usr and /etc.
#
# Local changes belong in /etc/systemd/system/oxim.service.d/, created with
# `systemctl edit oxim`, for example ReadWritePaths= for a file connector
# that writes outside /var/lib/oxim.
[Service]
# /var/lib/oxim holds the databases; relative paths in channel files (such
# as a file destination's directory) resolve here too.
StateDirectory=oxim
StateDirectoryMode=0750
LogsDirectory=oxim
LogsDirectoryMode=0750
WorkingDirectory=/var/lib/oxim
UMask=0027
# Serial analyzers: the dialout group owns /dev/ttyS* and /dev/ttyUSB*.
SupplementaryGroups=dialout
LimitNOFILE=65536
ProtectHome=read-only
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
ProtectClock=true
ProtectHostname=true
RestrictSUIDSGID=true
RestrictRealtime=true
RestrictNamespaces=true
LockPersonality=true
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
SystemCallArchitectures=native
