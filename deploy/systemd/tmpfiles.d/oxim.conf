# Directories OXIM needs (systemd-tmpfiles(8)). Existing directories keep
# their contents; only ownership and mode are corrected.
d /etc/oxim           0750 root oxim -
d /etc/oxim/channels  0750 root oxim -
d /etc/oxim/tables    0750 root oxim -
d /var/lib/oxim       0750 oxim oxim -
d /var/log/oxim       0750 oxim oxim -
