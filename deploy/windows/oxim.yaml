# OXIM engine configuration installed by the Windows installer in
# %ProgramData%\OXIM. Relative paths are resolved against this file.

# The message database (oxim.db) and the lab order cache (orders.db).
data_dir: data

# Channel files (*.yaml). Changes are picked up while OXIM runs.
# Examples: %ProgramFiles%\OXIM\examples\channels
channels_dir: channels

# Code and routing tables referenced by channel steps.
tables_dir: tables

# JavaScript files referenced by `script` steps.
scripts_dir: scripts

log:
  level: info          # or e.g. "info,oxim_connectors=debug"; OXIM_LOG overrides
  format: text         # text or json
  directory: logs      # a service has no console: write daily log files

retention:
  contents_after: 90d  # delete message contents of completed messages
  messages_after: 365d # delete completed messages entirely
  orders_after: 90d    # delete cached lab orders not changed since
  interval: 1h

reload:
  enabled: true
  interval: 5s

# Web server: REST API, Prometheus metrics (/metrics) and the web UI. It
# starts once a user exists: run `oxim users create-admin` first.
server:
  enabled: true
  listen: 127.0.0.1:8080   # local only; use e.g. 0.0.0.0:8443 with tls for remote access
  # tls: {cert: tls/oxim.pem, key: tls/oxim-key.pem}
  session_idle: 30m        # log out after this long without activity
  session_max: 12h         # log out this long after login
