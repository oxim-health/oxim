# OXIM configuration for the Docker demo (deploy/docker/compose.yaml).
# Mounted at /etc/oxim/oxim.yaml; relative paths resolve against /etc/oxim.
data_dir: /var/lib/oxim
channels_dir: channels
tables_dir: tables

log:
  level: info
  format: text

retention:
  contents_after: 7d
  messages_after: 30d
  orders_after: 7d
  interval: 1h

reload:
  enabled: true
  interval: 5s

# The web UI and REST API, published on 127.0.0.1:8080 by compose.yaml.
# Create the first user with:
#   docker compose -f deploy/docker/compose.yaml exec oxim oxim -c /etc/oxim/oxim.yaml users create-admin
server:
  enabled: true
  listen: 0.0.0.0:8080
