name: Feature request
description: Propose a capability or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is it hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How could OXIM solve it? Mention the relevant section of docs/SPEC.md if there is one.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
