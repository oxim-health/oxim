name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not include real patient data.** Replace names, identifiers, dates of birth and results with synthetic values.
        Security problems must be reported privately; see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Minimal steps and, if relevant, a synthetic message or configuration.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: Windows Server 2022 x64
  - type: textarea
    id: device
    attributes:
      label: Device or system involved
      description: Vendor, model and firmware or software version of the device or system on the other side, if any.
