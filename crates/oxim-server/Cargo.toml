[package]
name = "oxim-server"
description = "REST API, authentication, audit and metrics for the OXIM integration engine"
keywords = ["healthcare", "hl7", "rest", "api", "integration-engine"]
categories = ["web-programming::http-server"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
base64.workspace = true
futures-util.workspace = true
flate2.workspace = true
oxim-alert.workspace = true
oxim-astm.workspace = true
oxim-auth.workspace = true
oxim-core.workspace = true
oxim-devices.workspace = true
oxim-hl7.workspace = true
oxim-model.workspace = true
oxim-store.workspace = true
oxim-transform.workspace = true
regex.workspace = true
rusqlite.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tokio = { workspace = true, features = ["net", "fs"] }
tokio-rustls.workspace = true
thiserror.workspace = true
tokio-util = { workspace = true, features = ["io"] }
tower-http.workspace = true
tracing.workspace = true

[dev-dependencies]
http-body-util.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "net"] }
tower.workspace = true

[features]
# Include the built web UI (`ui/dist`, or the directory named by the
# `OXIM_UI_DIST` environment variable at build time) in the library. Without
# a built UI the server explains how to add one; Node is never required.
embedded-ui = []

[lints]
workspace = true
