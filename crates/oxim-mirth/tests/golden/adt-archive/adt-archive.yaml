id: adt-archive
name: ADT Archive
description: |-
  Receives ADT and ORU messages over MLLP
  and archives them as files.
enabled: true
source:
  type: mllp
  data_type: hl7v2
  settings: {listen: "127.0.0.1:6661", max_connections: 10}
filters:
- {type: path-in, path: MSH-9.1, values: [ADT, ORU]}
- {type: path-exists, path: PID-3.1}
- {type: condition, not: {path: MSH-3.1, matches: TEST}}
transformers:
- type: map
  operations:
  - {set: {path: MSH-6.1, value: ARCHIVE}}
  - {store: {path: PID-3.1, as: patientId}}
  - {copy: {from: PID-3.1, to: PID-2.1}}
  - {set: {path: PID-8, value: "{PID-8|U}"}}
destinations:
- id: archive
  type: file
  queue: {retry: {initial_delay: "5s", max_delay: "5s", multiplier: 1}}
  settings: {directory: /var/lib/oxim/archive, filename: "{message_id}.hl7"}
