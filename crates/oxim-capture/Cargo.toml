[package]
name = "oxim-capture"
description = "Capture files for OXIM: record device conversations through a TCP or serial proxy and replay them"
keywords = ["healthcare", "capture", "astm", "hl7", "testing"]
categories = ["command-line-utilities", "development-tools::testing"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[[bin]]
name = "oxim-capture"
path = "src/main.rs"

[dependencies]
clap.workspace = true
oxim-model.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "signal"] }
tokio-serial.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
