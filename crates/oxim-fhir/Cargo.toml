[package]
name = "oxim-fhir"
description = "HL7 FHIR R4 JSON resources and their mapping to the OXIM normalized clinical model"
keywords = ["fhir", "hl7", "healthcare", "interoperability", "laboratory"]
categories = ["encoding"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
oxim-core.workspace = true
oxim-model.workspace = true
serde.workspace = true
# FHIR decimals must keep their exact text (`5.40` stays `5.40`), and
# resources keep their element order when passed through.
serde_json = { workspace = true, features = ["arbitrary_precision", "preserve_order"] }
thiserror.workspace = true

[dev-dependencies]
oxim-astm.workspace = true
oxim-hl7.workspace = true
oxim-mapping.workspace = true
oxim-store.workspace = true
proptest.workspace = true
tokio.workspace = true

[lints]
workspace = true
