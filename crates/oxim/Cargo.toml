[package]
name = "oxim"
description = "OXIM: open-source clinical integration engine"
keywords = ["healthcare", "interoperability", "integration-engine", "hl7", "astm"]
categories = ["command-line-utilities", "network-programming"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[[bin]]
name = "oxim"
path = "src/main.rs"

[dependencies]
clap.workspace = true
oxim-auth.workspace = true
oxim-connectors.workspace = true
oxim-core.workspace = true
oxim-dicom.workspace = true
oxim-fhir.workspace = true
oxim-lab.workspace = true
oxim-mapping.workspace = true
oxim-model.workspace = true
oxim-server.workspace = true
oxim-store.workspace = true
oxim-transform.workspace = true
rpassword.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows-service.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "net"] }

# The Windows service entry point is an FFI boundary (ADR 0002), so this
# crate denies unsafe code instead of forbidding it; the service module
# allows it explicitly.
[lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
