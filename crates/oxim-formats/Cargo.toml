[package]
name = "oxim-formats"
description = "Lossless JSON, XML, delimited and fixed-width documents for OXIM channels"
keywords = ["json", "xml", "csv", "fixed-width", "healthcare"]
categories = ["parser-implementations", "encoding"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
encoding_rs.workspace = true
memchr.workspace = true
# `arbitrary_precision` keeps numbers exactly as written (`5.40` stays
# `5.40`), which matters for clinical values. It is unified across the
# workspace build, see the crate documentation.
serde_json = { workspace = true, features = ["preserve_order", "arbitrary_precision"] }
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
