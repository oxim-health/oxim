# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Every advisory fails the check. Record justified exceptions here with the
# advisory ID and a comment explaining why it does not affect OXIM.
ignore = []

[licenses]
# Permissive licenses compatible with distributing OXIM under MIT OR
# Apache-2.0 (ADR 0012). Copyleft licenses are not accepted.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# The list is policy, not an inventory: licenses may be allowed before any
# dependency uses them.
unused-allowed-license = "allow"
exceptions = [
    # Serial port support for analyzers on RS-232 lines. MPL-2.0 is a
    # file-level copyleft; the crate is used unmodified, so OXIM itself stays
    # MIT OR Apache-2.0. Accepted for this crate only.
    { allow = ["MPL-2.0"], crate = "serialport" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
