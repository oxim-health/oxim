# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Every advisory fails the check. Record justified exceptions here with the
# advisory ID and a comment explaining why it does not affect OXIM.
ignore = [
    # `encoding` is unmaintained; there is no vulnerability. dicom-rs 0.10
    # (used by oxim-dicom) decodes DICOM Specific Character Sets with its
    # static tables and offers no alternative backend.
    "RUSTSEC-2021-0153",
]

[licenses]
# Permissive licenses compatible with distributing OXIM under MIT OR
# Apache-2.0 (ADR 0012). Copyleft licenses are not accepted.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# The list is policy, not an inventory: licenses may be allowed before any
# dependency uses them.
unused-allowed-license = "allow"
exceptions = [
    # Serial port support for analyzers on RS-232 lines. MPL-2.0 is a
    # file-level copyleft; the crate is used unmodified, so OXIM itself stays
    # MIT OR Apache-2.0. Accepted for this crate only.
    { allow = ["MPL-2.0"], crate = "serialport" },
    # Character set tables of the `encoding` crate, used by dicom-rs for DICOM
    # Specific Character Sets. CC0-1.0 dedicates them to the public domain.
    { allow = ["CC0-1.0"], crate = "encoding-index-japanese" },
    { allow = ["CC0-1.0"], crate = "encoding-index-korean" },
    { allow = ["CC0-1.0"], crate = "encoding-index-simpchinese" },
    { allow = ["CC0-1.0"], crate = "encoding-index-singlebyte" },
    { allow = ["CC0-1.0"], crate = "encoding-index-tradchinese" },
    { allow = ["CC0-1.0"], crate = "encoding_index_tests" },
    # Mozilla's root certificate list, bundled by mysql_async's rustls
    # support (used by oxim-connectors-db). CDLA-Permissive-2.0 is a
    # permissive data license with no copyleft terms.
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
    # Quoted-printable encoding used by lettre (the SMTP destination of
    # oxim-connectors-remote). 0BSD is a public-domain-equivalent license
    # without even an attribution requirement.
    { allow = ["0BSD"], crate = "quoted_printable" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
