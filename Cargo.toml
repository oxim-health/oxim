[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
authors = ["The OXIM Contributors"]
repository = "https://github.com/oxim-health/oxim"
homepage = "https://github.com/oxim-health/oxim"
# Nothing is published before the complete 1.0 release (see docs/adr/0014).
publish = false

[workspace.dependencies]
argon2 = "0.5"
async-nats = { version = "0.50", default-features = false, features = ["ring", "jetstream", "nkeys", "server_2_10"] }
async-trait = "0.1"
lapin = { version = "4.12", default-features = false, features = ["rustls--ring", "rustls-native-certs", "tokio"] }
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls-ring"] }
rskafka = { version = "0.6", default-features = false, features = ["transport-tls", "compression-gzip", "compression-lz4", "compression-snappy", "compression-zstd"] }
tiberius = { version = "0.13", default-features = false, features = ["tds73"] }
tokio-postgres = "0.7"
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64 = "0.23"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.2"
rpassword = "7"
sha2 = "0.10"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
clap = { version = "4.6", features = ["derive"] }
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
windows-service = "0.8"
bytes = "1"
dicom-core = "0.10"
dicom-dictionary-std = { version = "0.10", features = ["sop-class"] }
dicom-json = "0.10"
dicom-object = "0.10"
# Without the default features: no image codecs (the router forwards pixel
# data as encoded) and no rayon thread pool.
dicom-transfer-syntax-registry = { version = "0.10", default-features = false }
dicom-ul = { version = "0.10", features = ["async"] }
encoding_rs = "0.8"
fs4 = "1.1"
fastrand = "2"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "logging"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "server", "tokio"] }
memchr = "2.7"
quick-xml = "0.42"
regex = "1.11"
ring = "0.17"
rquickjs = { version = "0.14", default-features = false, features = ["std", "parallel"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = "1.3"
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1.53", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tokio-serial = { version = "5.5", default-features = false }
tokio-util = "0.7"
tracing = "0.1"

oxim-anonymize = { path = "crates/oxim-anonymize" }
oxim-astm = { path = "crates/oxim-astm" }
oxim-auth = { path = "crates/oxim-auth" }
oxim-server = { path = "crates/oxim-server" }
oxim-cda = { path = "crates/oxim-cda" }
oxim-capture = { path = "crates/oxim-capture" }
oxim-connectors = { path = "crates/oxim-connectors" }
oxim-connectors-db = { path = "crates/oxim-connectors-db" }
oxim-connectors-messaging = { path = "crates/oxim-connectors-messaging" }
oxim-core = { path = "crates/oxim-core" }
oxim-devices = { path = "crates/oxim-devices" }
oxim-fhir = { path = "crates/oxim-fhir" }
oxim-dicom = { path = "crates/oxim-dicom" }
oxim-formats = { path = "crates/oxim-formats" }
oxim-hl7 = { path = "crates/oxim-hl7" }
oxim-alert = { path = "crates/oxim-alert" }
oxim-lab = { path = "crates/oxim-lab" }
oxim-mapping = { path = "crates/oxim-mapping" }
oxim-mirth = { path = "crates/oxim-mirth" }
oxim-mllp = { path = "crates/oxim-mllp" }
oxim-model = { path = "crates/oxim-model" }
oxim-ncpdp = { path = "crates/oxim-ncpdp" }
oxim-poct1a = { path = "crates/oxim-poct1a" }
oxim-script = { path = "crates/oxim-script" }
oxim-sim = { path = "crates/oxim-sim" }
oxim-store = { path = "crates/oxim-store" }
oxim-transform = { path = "crates/oxim-transform" }
oxim-x12 = { path = "crates/oxim-x12" }

rcgen = "0.14"
proptest = "1.5"
tempfile = "3"

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
