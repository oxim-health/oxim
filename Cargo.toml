[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["The OXIM Contributors"]
repository = "https://github.com/oxim-health/oxim"
homepage = "https://github.com/oxim-health/oxim"
# Nothing is published before the complete 1.0 release (see docs/adr/0014).
publish = false

[workspace.dependencies]
encoding_rs = "0.8"
memchr = "2.7"
quick-xml = "0.42"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"

oxim-hl7 = { path = "crates/oxim-hl7" }
oxim-mllp = { path = "crates/oxim-mllp" }
oxim-model = { path = "crates/oxim-model" }

proptest = "1.5"
tempfile = "3"

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
