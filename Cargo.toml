[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
authors = ["The OXIM Contributors"]
repository = "https://github.com/oxim-health/oxim"
homepage = "https://github.com/oxim-health/oxim"
# Nothing is published before the complete 1.0 release (see docs/adr/0014).
publish = false

[workspace.dependencies]
async-trait = "0.1"
encoding_rs = "0.8"
fastrand = "2"
memchr = "2.7"
quick-xml = "0.42"
regex = "1.11"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = "1.3"
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1.53", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"

oxim-astm = { path = "crates/oxim-astm" }
oxim-core = { path = "crates/oxim-core" }
oxim-formats = { path = "crates/oxim-formats" }
oxim-hl7 = { path = "crates/oxim-hl7" }
oxim-mllp = { path = "crates/oxim-mllp" }
oxim-model = { path = "crates/oxim-model" }
oxim-poct1a = { path = "crates/oxim-poct1a" }
oxim-store = { path = "crates/oxim-store" }
oxim-transform = { path = "crates/oxim-transform" }

proptest = "1.5"
tempfile = "3"

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
